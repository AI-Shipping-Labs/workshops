AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FAQ agent served directly from AWS Lambda with SSE response streaming.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the Lambda container image.
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key exposed to the Lambda runtime as OPENAI_API_KEY.

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Architectures:
      - x86_64

Resources:
  FaqAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - content-type

Outputs:
  FunctionUrl:
    Description: Public Lambda Function URL serving the frontend and API.
    Value: !GetAtt FaqAgentFunctionUrl.FunctionUrl

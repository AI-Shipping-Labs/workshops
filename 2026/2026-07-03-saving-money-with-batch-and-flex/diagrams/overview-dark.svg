<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Batch the independent work around the live agent</title>
  <desc id="desc">Synthetic question generation and judging contain independent requests that can use Batch, while the evaluated agent keeps its dependent model-and-tool turns live; generation also has a Flex execution option.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60a5fa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fb923c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bfff00"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fafafa; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #a3a3a3; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #a3a3a3; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #404040; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #262626; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #d4d4d4; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #a3a3a3; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="390" fill="#0a0a0a"/>

  <path class="edge" d="M220 115L260 115" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M460 115L500 115" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M700 115L740 115" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M360 250L360 170" stroke="#a3a3a3" stroke-dasharray="8 8"/>
  <path class="edge" d="M840 250L840 170" stroke="#a3a3a3" stroke-dasharray="8 8"/>

  <g class="node node-blue" transform="translate(20 60)" filter="url(#shadow)">
    <rect width="200" height="110" rx="18" fill="#172554" stroke="#60a5fa"/>
    <use href="#icon-document" x="54" y="25" width="34" height="34" color="#60a5fa"/>
    <text class="node-title icon-copy" x="92.93" y="49.2" font-size="20">FAQ</text>
    <text class="node-subtitle" x="100" y="80" font-size="16">Source documents</text>
  </g>
  <g class="node node-amber" transform="translate(260 60)" filter="url(#shadow)">
    <rect width="200" height="110" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-settings" x="20.69" y="14" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="65.26" y="38.2" font-size="20">Questions</text>
    <text class="node-subtitle" x="100" y="69" font-size="16">Independent</text>
    <text class="node-subtitle" x="100" y="91" font-size="16">requests</text>
  </g>
  <g class="node node-purple" transform="translate(500 60)" filter="url(#shadow)">
    <rect width="200" height="110" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-robot" x="17.91" y="14" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="61.8" y="38.2" font-size="20">Live agent</text>
    <text class="node-subtitle" x="100" y="69" font-size="16">Sequential model +</text>
    <text class="node-subtitle" x="100" y="91" font-size="16">tool turns</text>
  </g>
  <g class="node node-amber" transform="translate(740 60)" filter="url(#shadow)">
    <rect width="200" height="110" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-check" x="45.12" y="25" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="88.3" y="49.2" font-size="20">Judge</text>
    <text class="node-subtitle" x="100" y="80" font-size="16">Independent checks</text>
  </g>
  <g class="node node-purple" transform="translate(260 250)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <text class="eyebrow" x="100" y="20.5" font-size="13">MODE</text>
    <text class="node-title" x="100" y="54.7" font-size="20">Batch or Flex</text>
  </g>
  <g class="node node-purple" transform="translate(740 250)" filter="url(#shadow)">
    <rect width="200" height="80" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <text class="eyebrow" x="100" y="20.5" font-size="13">MODE</text>
    <text class="node-title" x="100" y="54.7" font-size="20">Batch</text>
  </g>
</svg>

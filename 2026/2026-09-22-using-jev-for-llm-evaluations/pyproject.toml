[project]
name = "using-jev-for-llm-evaluations"
version = "0.1.0"
description = "Workshop code for judging LLM evaluations with Jev, Laya, and an OpenAI baseline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "minsearch>=0.0.10",
    "openai>=2.31.0",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
laya = [
    "laya==0.3.5",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

<svg xmlns="http://www.w3.org/2000/svg" width="950" height="530" viewBox="0 0 950 530" role="img" aria-labelledby="title desc">
  <title id="title">The browser streams voice directly to ElevenAgents</title>
  <desc id="desc">Next.js keeps the API key and obtains signed session URLs, while the browser streams directly to ElevenAgents and provider-side conversation retention remains separate from the app&#x27;s live transcript.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60a5fa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fb923c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bfff00"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fafafa; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #a3a3a3; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #a3a3a3; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #404040; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #262626; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #d4d4d4; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #a3a3a3; text-anchor: middle; }
    </style>
  </defs>
  <rect width="950" height="530" fill="#0a0a0a"/>

  <g class="node-boundary node-blue" transform="translate(335 20)">
    <rect width="605" height="460" rx="22" fill="none" stroke="#60a5fa"/>
    <text class="boundary-title" x="20" y="31">ELEVENLABS</text>
  </g>
  <path class="edge-boundary-halo" d="M290 135L670 135" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M290 135L670 135" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(480 135)">
    <rect x="-55.88" y="-16" width="111.76" height="32" rx="16.0" fill="#0a0a0a" stroke="#a3a3a3"/>
    <text fill="#a3a3a3">WebSocket</text>
  </g>
  <path class="edge" d="M165 190L165 340" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(165 265)">
    <rect x="-56.82" y="-16" width="113.65" height="32" rx="16.0" fill="#0a0a0a" stroke="#a3a3a3"/>
    <text fill="#a3a3a3">Signed URL</text>
  </g>
  <path class="edge-boundary-halo" d="M290 395L355 395" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M290 395L355 395" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M795 190L795 340" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M605 395L670 395" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(40 80)" filter="url(#shadow)">
    <rect width="250" height="110" rx="18" fill="#172554" stroke="#60a5fa"/>
    <use href="#icon-browser" x="55.69" y="25" width="34" height="34" color="#60a5fa"/>
    <text class="node-title icon-copy" x="101.69" y="49.2" font-size="20">Browser</text>
    <text class="node-subtitle" x="125" y="80" font-size="16">LIVE · voice + transcript</text>
  </g>
  <g class="node node-purple" transform="translate(40 340)" filter="url(#shadow)">
    <rect width="250" height="110" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-api" x="62.62" y="14" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="105.8" y="38.2" font-size="20">Next.js</text>
    <text class="node-subtitle" x="125" y="69" font-size="16">CONTROL · server key +</text>
    <text class="node-subtitle" x="125" y="91" font-size="16">signed URLs</text>
  </g>
  <g class="node node-amber" transform="translate(670 80)" filter="url(#shadow)">
    <rect width="250" height="110" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-robot" x="25.19" y="25" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="69.08" y="49.2" font-size="20">ElevenAgents</text>
    <text class="node-subtitle" x="125" y="80" font-size="16">Managed voice session</text>
  </g>
  <g class="node node-purple" transform="translate(355 340)" filter="url(#shadow)">
    <rect width="250" height="110" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-api" x="16.22" y="25" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="59.4" y="49.2" font-size="20">ElevenLabs API</text>
    <text class="node-subtitle" x="125" y="80" font-size="16">Sessions, cost, deletion</text>
  </g>
  <g class="node node-green" transform="translate(670 340)" filter="url(#shadow)">
    <rect width="250" height="110" rx="18" fill="#1a2e05" stroke="#bfff00"/>
    <use href="#icon-database" x="56.69" y="25" width="34" height="34" color="#bfff00"/>
    <text class="node-title icon-copy" x="98.44" y="49.2" font-size="20">Records</text>
    <text class="node-subtitle" x="125" y="80" font-size="16">Provider retention settings</text>
  </g>
</svg>

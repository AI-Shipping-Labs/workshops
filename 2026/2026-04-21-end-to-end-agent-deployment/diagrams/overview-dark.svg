    <text class="icon-node-title" x="80" y="137">Browser</text>
  </g>
  <g class="node node-purple" transform="translate(250 110)" filter="url(#shadow)">
    <rect width="210" height="110" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-api" x="39.06" y="14" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="82.24" y="38.2" font-size="20">FastAPI</text>
    <text class="node-subtitle" x="105" y="69" font-size="16">JSON or SSE</text>
    <text class="node-subtitle" x="105" y="91" font-size="16">responses</text>
  </g>
  <g class="node node-purple" transform="translate(530 110)" filter="url(#shadow)">
    <rect width="210" height="110" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-robot" x="48.5" y="25" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="92.39" y="49.2" font-size="20">Agent</text>
    <text class="node-subtitle" x="105" y="80" font-size="16">Owns the tool loop</text>
  </g>
  <g class="node node-amber" transform="translate(810 110)" filter="url(#shadow)">
    <rect width="210" height="110" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-search" x="43.04" y="25" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="85.36" y="49.2" font-size="20">Search</text>
    <text class="node-subtitle" x="105" y="80" font-size="16">In-memory minsearch</text>
  </g>
  <g class="node node-amber" transform="translate(530 330)" filter="url(#shadow)">
    <rect width="210" height="110" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-openai" x="41.06" y="14" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="87.06" y="38.2" font-size="20">OpenAI</text>
    <text class="node-subtitle" x="105" y="69" font-size="16">Responses API ·</text>
    <text class="node-subtitle" x="105" y="91" font-size="16">inference</text>
  </g>
</svg>

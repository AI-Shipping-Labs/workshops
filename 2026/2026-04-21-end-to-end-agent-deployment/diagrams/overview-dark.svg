<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480" viewBox="0 0 1050 480" role="img" aria-labelledby="title desc">
  <title id="title">The application runs the agent loop</title>
  <desc id="desc">FastAPI streams results to the browser while the application&#x27;s agent loop exchanges model messages with OpenAI and executes FAQ searches locally.</desc>
  <defs>

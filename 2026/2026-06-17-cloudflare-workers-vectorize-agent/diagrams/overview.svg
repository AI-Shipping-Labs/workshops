<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare serves the app; ingestion runs locally</title>
  <desc id="desc">TypeScript and Python Workers share the same deployed UI, agent, Workers AI, and Vectorize architecture, while a local ingestion script embeds and uploads the FAQ separately.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#648900"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #525252; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #525252; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #d4d4d4; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f5f5f5; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #404040; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #525252; text-anchor: middle; }
    </style>
  </defs>
  <rect width="980" height="580" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(280 40)">
    <rect width="640" height="355" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">CLOUDFLARE</text>
  </g>
  <path class="edge-boundary-halo" d="M190 155L300 155" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M190 155L300 155" stroke="#737373" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M520 155L680 155" stroke="#737373" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M410 210V232.5H650V255" stroke="#737373" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M300 485L680 485" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M680 466.67L650 466.67L650 365" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M680 466.67L650 466.67L650 365" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M790 430V320H790V210" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M790 430V320H790V210" stroke="#737373" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>

  <g class="node-icon-only node-blue" transform="translate(30 99)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#2563eb"/>
    <text class="icon-node-title" x="80" y="137">Browser</text>
  </g>
  <g class="node node-purple" transform="translate(300 100)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
    <use href="#icon-robot" x="45.81" y="25" width="34" height="34" color="#7c3aed"/>
    <text class="node-title icon-copy" x="89.7" y="49.2" font-size="20">Worker</text>
    <text class="node-subtitle" x="110" y="80" font-size="16">RUNTIME · UI + agent</text>
  </g>
  <g class="node node-amber" transform="translate(680 100)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-api" x="25.03" y="14" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="68.21" y="38.2" font-size="20">Workers AI</text>
    <text class="node-subtitle" x="110" y="69" font-size="16">Embeddings +</text>
    <text class="node-subtitle" x="110" y="91" font-size="16">answers</text>
  </g>
  <g class="node node-green" transform="translate(540 255)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-database" x="34.12" y="14" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="75.87" y="38.2" font-size="20">Vectorize</text>
    <text class="node-subtitle" x="110" y="69" font-size="16">Hosted FAQ vector</text>
    <text class="node-subtitle" x="110" y="91" font-size="16">index</text>
  </g>
  <g class="node node-blue" transform="translate(80 430)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="64" y="14" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="102.93" y="38.2" font-size="20">FAQ</text>
    <text class="node-subtitle" x="110" y="69" font-size="16">LOCAL PREPARATION ·</text>
    <text class="node-subtitle" x="110" y="91" font-size="16">documents</text>
  </g>
  <g class="node node-amber" transform="translate(680 430)" filter="url(#shadow)">
    <rect width="220" height="110" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-settings" x="51.56" y="25" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="96.13" y="49.2" font-size="20">Ingest</text>
    <text class="node-subtitle" x="110" y="80" font-size="16">Operator-run script</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare serves the app; ingestion runs locally</title>
  <desc id="desc">TypeScript and Python Workers share the same deployed UI, agent, Workers AI, and Vectorize architecture, while a local ingestion script embeds and uploads the FAQ separately.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60a5fa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fb923c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bfff00"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fafafa; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #a3a3a3; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #a3a3a3; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #404040; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #262626; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #d4d4d4; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #a3a3a3; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="650" fill="#0a0a0a"/>

  <g class="node-boundary node-blue" transform="translate(280 20)">
    <rect width="640" height="440" rx="22" fill="none" stroke="#60a5fa"/>
    <text class="boundary-title" x="20" y="31">CLOUDFLARE</text>
  </g>
  <path class="edge-boundary-halo" d="M190 130L300 125" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M190 130L300 125" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M500 125L700 125" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M400 170L400 340" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M230 575L700 575" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M700 560L400 560L400 430" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M700 560L400 560L400 430" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M800 530V350H800V170" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M800 530V350H800V170" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>

  <g class="node-icon-only node-blue" transform="translate(30 74)">
    <use href="#icon-browser" x="0" y="0" width="160" height="112" color="#60a5fa"/>
    <text class="icon-node-title" x="80" y="137">Browser</text>
  </g>
  <g class="node node-purple" transform="translate(300 80)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-robot" x="16" y="4" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">Worker</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">UI + agent · TS or</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">Python</text>
  </g>
  <g class="node node-amber" transform="translate(700 80)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-api" x="16" y="4" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">AI</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">Workers AI · embed</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">and answer</text>
  </g>
  <g class="node node-green" transform="translate(300 340)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#1a2e05" stroke="#bfff00"/>
    <use href="#icon-database" x="16" y="15" width="34" height="34" color="#bfff00"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Vectorize</text>
    <text class="node-subtitle" x="100" y="70" font-size="16">FAQ vector index</text>
  </g>
  <g class="node node-blue" transform="translate(30 530)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#172554" stroke="#60a5fa"/>
    <use href="#icon-document" x="16" y="15" width="34" height="34" color="#60a5fa"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">FAQ</text>
    <text class="node-subtitle" x="100" y="70" font-size="16">Source documents</text>
  </g>
  <g class="node node-amber" transform="translate(700 530)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-settings" x="16" y="15" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Ingest</text>
    <text class="node-subtitle" x="100" y="70" font-size="16">Operator-run script</text>
  </g>
</svg>

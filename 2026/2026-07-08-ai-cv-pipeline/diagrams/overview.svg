<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Editable CV variants share one renderer</title>
  <desc id="desc">Each tailored CV has its own editable YAML source, all variants use the same renderer, and HTML and PDF are derived outputs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2410c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#648900"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#737373"/></marker>
    <symbol id="icon-browser" viewBox="0 0 32 22">
        <rect x="1" y="1.5" width="30" height="19" rx="2.25" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <path d="M1.5 6.5h29" fill="none" stroke="currentColor" stroke-width="2.67"/>
        <circle cx="4" cy="4" r=".48" fill="currentColor"/>
        <circle cx="6.2" cy="4" r=".48" fill="currentColor"/>
        <circle cx="8.4" cy="4" r=".48" fill="currentColor"/>
        <rect x="12" y="3.3" width="15" height="1.5" rx=".75" fill="currentColor" opacity=".35"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #525252; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #525252; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #d4d4d4; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #f5f5f5; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #404040; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #525252; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <g class="node-boundary node-blue" transform="translate(15 20)">
    <rect width="230" height="510" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">EDIT CONTENT</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(680 100)">
    <rect width="230" height="385" rx="22" fill="none" stroke="#2563eb"/>
    <text class="boundary-title" x="20" y="31">GENERATED</text>
  </g>
  <path class="edge-boundary-halo" d="M225 125H378Q390 125 390 137V245" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M225 125H378Q390 125 390 137V245" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M225 290L365 290" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M225 290L365 290" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M225 455H378Q390 455 390 443V335" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M225 455H378Q390 455 390 443V335" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M555 290H710.5Q722.5 290 722.5 278V250" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M555 290H710.5Q722.5 290 722.5 278V250" stroke="#737373" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M795 250L795 365" stroke="#737373" marker-end="url(#arrow-gray)"/>

  <g class="node node-blue" transform="translate(35 80)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="16" y="15" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Base</text>
    <text class="node-subtitle" x="95" y="70" font-size="16">alexey</text>
  </g>
  <g class="node node-blue" transform="translate(35 245)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="16" y="15" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Education</text>
    <text class="node-subtitle" x="95" y="70" font-size="16">alexey-edtech</text>
  </g>
  <g class="node node-blue" transform="translate(35 410)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#eff6ff" stroke="#2563eb"/>
    <use href="#icon-document" x="16" y="15" width="34" height="34" color="#2563eb"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Company</text>
    <text class="node-subtitle" x="95" y="70" font-size="16">alexey-knowunity</text>
  </g>
  <g class="node node-amber" transform="translate(365 245)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#icon-settings" x="16" y="15" width="34" height="34" color="#c2410c"/>
    <text class="node-title icon-copy" x="62" y="39.2" font-size="20">Renderer</text>
    <text class="node-subtitle" x="95" y="70" font-size="16">cv/render.py</text>
  </g>
  <g class="node node-green" transform="translate(700 160)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-browser" x="16" y="4" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">HTML CV</text>
    <text class="node-subtitle" x="95" y="59" font-size="16">Generated print</text>
    <text class="node-subtitle" x="95" y="81" font-size="16">layout</text>
  </g>
  <g class="node node-green" transform="translate(700 365)" filter="url(#shadow)">
    <rect width="190" height="90" rx="18" fill="#f5fbe7" stroke="#648900"/>
    <use href="#icon-document" x="16" y="4" width="34" height="34" color="#648900"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">PDF CV</text>
    <text class="node-subtitle" x="95" y="59" font-size="16">Printed with</text>
    <text class="node-subtitle" x="95" y="81" font-size="16">Chromium</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Durable index, local query path</title>
  <desc id="desc">Offline ingestion writes document embeddings to Turso; application startup syncs a local replica, and each agent query is embedded and searched locally.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60a5fa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fb923c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bfff00"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <symbol id="icon-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 5v7c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12v7c0 1.66 3.58 3 8 3s8-1.34 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fafafa; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #a3a3a3; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #a3a3a3; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #404040; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #262626; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #d4d4d4; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #a3a3a3; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="530" fill="#0a0a0a"/>

  <line class="divider" x1="46" y1="265" x2="914" y2="265"/>

  <path class="edge" d="M290 120L370 120" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M590 120L670 120" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M290 410L370 410" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M590 410L670 410" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M780 170L780 360" stroke="#a3a3a3" stroke-dasharray="8 8" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(780 265)">
    <rect x="-63.1" y="-16" width="126.2" height="32" rx="16.0" fill="#0a0a0a" stroke="#a3a3a3"/>
    <text fill="#a3a3a3">Sync on boot</text>
  </g>

  <g class="node node-blue" transform="translate(70 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#172554" stroke="#60a5fa"/>
    <use href="#icon-document" x="16" y="20" width="34" height="34" color="#60a5fa"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">FAQ</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Source documents</text>
  </g>
  <g class="node node-amber" transform="translate(370 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-settings" x="16" y="9" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="33.2" font-size="20">Ingest</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">ONNX document</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">embeddings</text>
  </g>
  <g class="node node-green" transform="translate(670 70)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#1a2e05" stroke="#bfff00"/>
    <use href="#icon-database" x="16" y="20" width="34" height="34" color="#bfff00"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Turso</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">Durable vector index</text>
  </g>
  <g class="node node-purple" transform="translate(70 360)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-robot" x="16" y="20" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">FAQ agent</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">FastAPI + OpenAI</text>
  </g>
  <g class="node node-amber" transform="translate(370 360)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-search" x="16" y="20" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="44.2" font-size="20">Search</text>
    <text class="node-subtitle" x="110" y="75" font-size="16">ONNX + sqlitesearch</text>
  </g>
  <g class="node node-green" transform="translate(670 360)" filter="url(#shadow)">
    <rect width="220" height="100" rx="18" fill="#1a2e05" stroke="#bfff00"/>
    <use href="#icon-database" x="16" y="9" width="34" height="34" color="#bfff00"/>
    <text class="node-title icon-copy" x="62" y="33.2" font-size="20">Replica</text>
    <text class="node-subtitle" x="110" y="64" font-size="16">Reads stay on app</text>
    <text class="node-subtitle" x="110" y="86" font-size="16">host</text>
  </g>
</svg>

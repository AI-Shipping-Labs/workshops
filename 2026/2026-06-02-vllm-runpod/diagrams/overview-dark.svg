<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Remote inference, local tool execution</title>
  <desc id="desc">The local Python agent executes FAQ search and exchanges model turns with vLLM on a RunPod GPU, while model weights download into a persistent cache at startup.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a78bfa"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#60a5fa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fb923c"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bfff00"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f87171"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3a3a3"/></marker>
    <symbol id="icon-api" viewBox="0 0 24 24">
        <path d="m8 5-5 7 5 7M16 5l5 7-5 7M14 3l-4 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
        <path d="M6 2h8l4 4v16H6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-robot" viewBox="0 0 24 24">
        <path d="M12 5V2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="2.5" r="1" fill="currentColor"/>
        <rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 10H2.5v5H4M20 10h1.5v5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9" cy="11" r="1.3" fill="currentColor"/>
        <circle cx="15" cy="11" r="1.3" fill="currentColor"/>
        <path d="M8.5 16h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24">
        <path d="M3 4h18v16H3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M6 9h12M6 14h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="17" cy="14" r="1.2" fill="currentColor"/>
      </symbol>
    <style>
      text { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fafafa; }
      symbol [stroke] { vector-effect: non-scaling-stroke; }
      .node rect { stroke-width: 2; }
      .node-boundary rect { stroke-width: 2; stroke-dasharray: 8 8; }
      .boundary-title { font-size: 16px; font-weight: 750; text-anchor: start; }
      .node-title { font-weight: 750; text-anchor: middle; }
      .node-title.icon-copy { text-anchor: start; }
      .node-subtitle { font-weight: 500; fill: #a3a3a3; text-anchor: middle; }
      .eyebrow { font-weight: 750; letter-spacing: 1px; fill: #a3a3a3; text-anchor: middle; }
      .mention-icon { font-size: 27px; font-weight: 750; text-anchor: middle; }
      .standalone-mention { font-size: 52px; font-weight: 750; text-anchor: middle; }
      .icon-node-title { font-size: 16px; font-weight: 750; text-anchor: middle; }
      .edge { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label rect { stroke-width: 2; }
      .edge-label text { font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .divider { stroke: #404040; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; }
      .center-annotation { fill: #262626; stroke: none; }
      .center-title { font-weight: 800; letter-spacing: 0.08em; fill: #d4d4d4; text-anchor: middle; }
      .center-detail { font-weight: 600; fill: #a3a3a3; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#0a0a0a"/>

  <g class="node-boundary node-blue" transform="translate(70 80)">
    <rect width="240" height="370" rx="22" fill="none" stroke="#60a5fa"/>
    <text class="boundary-title" x="20" y="31">LOCAL MACHINE</text>
  </g>
  <g class="node-boundary node-blue" transform="translate(650 80)">
    <rect width="240" height="370" rx="22" fill="none" stroke="#60a5fa"/>
    <text class="boundary-title" x="20" y="31">RUNPOD GPU POD</text>
  </g>
  <path class="edge" d="M190 230L190 330" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <path class="edge-boundary-halo" d="M290 185L670 185" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M290 185L670 185" stroke="#a3a3a3" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-gray)"/>
  <g class="edge-label" transform="translate(480 185)">
    <rect x="-37.55" y="-16" width="75.1" height="32" rx="16.0" fill="#0a0a0a" stroke="#a3a3a3"/>
    <text fill="#a3a3a3">HTTPS</text>
  </g>
  <path class="edge-boundary-halo" d="M580 375L670 375" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M580 375L670 375" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M770 330L770 230" stroke="#a3a3a3" marker-end="url(#arrow-gray)"/>

  <g class="node node-purple" transform="translate(90 140)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#2e1065" stroke="#a78bfa"/>
    <use href="#icon-robot" x="16" y="4" width="34" height="34" color="#a78bfa"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">Agent</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">Python · owns tool</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">loop</text>
  </g>
  <g class="node node-amber" transform="translate(90 330)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-search" x="16" y="4" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">Search</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">Local keyword</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">scoring</text>
  </g>
  <g class="node node-amber" transform="translate(670 140)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#431407" stroke="#fb923c"/>
    <use href="#icon-api" x="16" y="4" width="34" height="34" color="#fb923c"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">vLLM</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">OpenAI-compatible</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">API</text>
  </g>
  <g class="node node-green" transform="translate(670 330)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#1a2e05" stroke="#bfff00"/>
    <use href="#icon-volume" x="16" y="4" width="34" height="34" color="#bfff00"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">Cache</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">Persistent ·</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">/workspace</text>
  </g>
  <g class="node node-blue" transform="translate(380 330)" filter="url(#shadow)">
    <rect width="200" height="90" rx="18" fill="#172554" stroke="#60a5fa"/>
    <use href="#icon-document" x="16" y="4" width="34" height="34" color="#60a5fa"/>
    <text class="node-title icon-copy" x="62" y="28.2" font-size="20">Source</text>
    <text class="node-subtitle" x="100" y="59" font-size="16">Model startup</text>
    <text class="node-subtitle" x="100" y="81" font-size="16">download</text>
  </g>
</svg>
